name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/service-api-key-node-sdk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require package-lock.json
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing. Run 'npm install' locally and commit the generated lockfile."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests and production builds
        run: npm run verify

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require package-lock.json
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing. Run 'npm install' locally and commit the generated lockfile."
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build NestJS API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/config-api/Dockerfile
          target: runner
          push: false
          cache-from: type=gha,scope=opspilot-api
          cache-to: type=gha,mode=max,scope=opspilot-api

      - name: Build Next.js web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000/api
          cache-from: type=gha,scope=opspilot-web
          cache-to: type=gha,mode=max,scope=opspilot-web
